name: agent-crew-2

services:
  gateway:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: runtime
    image: agent-crew-openclaw:2026.11.3
    init: true
    group_add: ["${AGENT_CREW_DOCKER_SOCKET_GID:-1001}"]
    command: ["openclaw", "gateway", "--allow-unconfigured", "--bind", "lan"]
    environment:
      OPENCLAW_GATEWAY_TOKEN: disposable-agent-crew-token
      AGENT_CREW_GATEWAY_TOKEN: disposable-agent-crew-token
      OPENCLAW_CONFIG_PATH: /app/extensions/agent-crew/openclaw.json
      TMPDIR: /home/node/.openclaw/tmp
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - ${AGENT_CREW_OPENCLAW_STATE_DIR:-../../../.local/openclaw-gateway-state}:/home/node/.openclaw
      - ${AGENT_CREW_WORKTREE_DIR:-../../../.local/worktrees}:/home/node/.openclaw/worktrees
      - ${AGENT_CREW_PROJECTION_DIR:-../../../.local/worktree-projections}:/home/node/.openclaw/worktree-projections
      - ${AGENT_CREW_SANDBOX_STATE_DIR:-../../../.local/sandbox}:/home/node/.openclaw/sandbox
      - ${AGENT_CREW_REPOSITORY_DIR:-../../../.local/repositories}:/workspaces/repositories
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 6
    restart: unless-stopped

  checks:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: checks
    image: agent-crew-openclaw-checks:2026.11.3
    init: true
    profiles: ["check"]
    environment:
      OPENCLAW_GATEWAY_TOKEN: disposable-agent-crew-token
      LINT_SOURCE_ROOT: /lint-source
    volumes:
      - ../../..:/lint-source:ro

volumes:
  openclaw-data:
