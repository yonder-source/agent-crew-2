name: agent-crew-2

services:
  gateway:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: runtime
    image: agent-crew-openclaw:2026.11.3
    init: true
    command: ["openclaw", "gateway", "--allow-unconfigured", "--bind", "lan"]
    environment:
      OPENCLAW_GATEWAY_TOKEN: disposable-agent-crew-token
      AGENT_CREW_GATEWAY_TOKEN: disposable-agent-crew-token
      OPENCLAW_CONFIG_PATH: /app/extensions/agent-crew/openclaw.json
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - openclaw-data:/home/node/.openclaw
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 6
    restart: unless-stopped

  checks:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: checks
    image: agent-crew-openclaw-checks:2026.11.3
    init: true
    profiles: ["check"]
    environment:
      OPENCLAW_GATEWAY_TOKEN: disposable-agent-crew-token

volumes:
  openclaw-data:
