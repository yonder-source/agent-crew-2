<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Repository connection — wireframe prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#eee;color:#202020}header{height:58px;background:#252525;color:white;display:flex;align-items:center;padding:0 28px;font-weight:650;gap:26px}header small{font-weight:400;color:#bbb}.shell{display:flex;min-height:calc(100vh - 58px)}nav{width:200px;padding:28px 20px;background:#dedede}nav div{padding:10px}nav .selected{background:#bbb;font-weight:700}main{padding:36px 48px 110px;max-width:1250px;flex:1}h1{font-size:27px;margin:0 0 6px}h2{font-size:17px;margin:0 0 18px}p{line-height:1.5;color:#555;margin:0 0 20px}.intro{margin-bottom:28px}.box{border:1px solid #aaa;background:white;padding:24px;margin-bottom:18px}.grid{display:grid;grid-template-columns:minmax(300px, 1.5fr) minmax(240px,1fr);gap:20px}.fields label{display:block;font-weight:650;margin:0 0 7px}.fields input,.fields select{font:inherit;width:100%;padding:11px;border:1px solid #999;background:#fafafa}.field{margin-bottom:20px}.hint{display:block;font-size:13px;color:#666;margin-top:6px}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #ddd}.row:last-child{border:0}.badge{font-size:12px;border:1px solid #999;padding:3px 7px;white-space:nowrap;height:max-content}.actions{display:flex;gap:24px;align-items:center;flex-wrap:wrap}button{font:inherit;padding:10px 16px;background:white;border:1px solid #777;cursor:pointer}.primary{background:#333;color:white}.note{background:#f1f1f1;border-left:4px solid #777;padding:14px;margin:18px 0;color:#333}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:white;border-radius:30px;padding:5px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px #999;white-space:nowrap}.switcher button{border:0;background:#444;color:white;border-radius:50%;width:36px;height:36px;padding:0}.switcher span{min-width:180px;text-align:center}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.steps div{padding:10px 18px;background:#ddd}.steps .current{background:#333;color:white}.split{display:grid;grid-template-columns:220px 1fr;gap:24px}.side-list div{padding:14px;border-bottom:1px solid #bbb}.side-list .current{background:#ddd;font-weight:700}.wide{max-width:850px}.compact .field{display:grid;grid-template-columns:170px 1fr;align-items:start;gap:12px}.compact label{padding-top:11px}.bottom{margin-top:22px}.status{color:#555;font-size:13px} @media(max-width:760px){nav{display:none}main{padding:24px 18px 100px}.grid,.split{grid-template-columns:1fr}.compact .field{display:block}.compact label{padding:0}.side-list{display:flex;overflow:auto}.switcher span{min-width:135px}}
</style></head><body><header>OpenClaw <small> / Agent Crew</small></header><div class="shell"><nav><div>Overview</div><div>Sessions</div><div>Agents</div><div class="selected">Repository</div><div>Settings</div></nav><main id="app"></main></div><div class="switcher"><button id="prev" aria-label="Previous layout">←</button><span id="variant-label"></span><button id="next" aria-label="Next layout">→</button></div>
<script>
// Throwaway prototype: three repository settings layouts, switchable via ?variant=.
const fields = `<div class="fields"><div class="field"><label for="app-id">GitHub App ID</label><input id="app-id" value="123456" inputmode="numeric"><span class="hint">ID of the GitHub App installed on your repository</span></div><div class="field"><label for="repo">GitHub repository</label><select id="repo"><option>owner/repository</option><option>owner/another-repository</option><option>example-team/project</option></select><span class="hint">Repositories available to this GitHub App</span></div><div class="field"><label for="checkout">Repository source path</label><input id="checkout" value="/workspaces/repositories/owner/repository"><span class="hint">Pre-filled Gateway path; Apply clones the source if it does not exist</span></div><div class="field"><label for="agent">Coding agent ID</label><select id="agent"><option value="coding">coding</option><option value="coding-alt">coding-alt</option></select><span class="hint">Select an existing OpenClaw agent</span></div><div class="field"><label for="coding-channel">Coding Slack channel ID</label><input id="coding-channel" value="C0123456789"></div><div class="field"><label for="coding-users">Coding authorized user IDs</label><input id="coding-users" value="U0123456789"></div><div class="field"><label for="designer">Designer agent ID</label><select id="designer"><option>designer</option></select></div><div class="field"><label for="designer-channel">Designer Slack channel ID</label><input id="designer-channel" value="C0987654321"></div><div class="field"><label for="designer-users">Designer authorized user IDs</label><input id="designer-users" value="U0123456789"></div><div class="field"><label for="budget">Coding task token budget</label><input id="budget" placeholder="Set a token limit" inputmode="numeric"><span class="hint">Shared limit across coding turns for each task</span></div></div>`;
const results = `<div class="row"><span>Automatic polling</span><span class="badge">Running</span></div><div class="row"><span>Slack Bot Token</span><span class="badge">Available</span></div><div class="row"><span>Slack App-Level Token</span><span class="badge">Available</span></div><div class="row"><span>GitHub App private key</span><span class="badge">Available</span></div><div class="row"><span>Repository read access</span><span class="badge">Confirmed</span></div><div class="row"><span>Repository source matches</span><span class="badge">Confirmed</span></div><div class="row"><span>Issue write permission</span><span class="badge">Granted</span></div><div class="row"><span>Contents write permission</span><span class="badge">Granted</span></div><div class="row"><span>Pull requests permission</span><span class="badge">Granted</span></div><p class="hint">Granted permissions do not guarantee writes will succeed.</p><button type="button" data-action="polling">Restart polling</button>`;
const action = `<div class="actions"><button type="button" data-action="save">Save</button><button type="button" class="primary" data-action="apply">Apply</button><span class="status" data-save-feedback></span></div>`;
const note = `<div class="note">Save keeps a draft. Apply is blocked while jobs are active or uncertain. An operator may force a Gateway restart; interrupted jobs require inspection.</div>`;
const title = `<h1>Repository connection</h1><p class="intro">Connect the GitHub repository used by Agent Crew.</p>`;
const layouts = [
{key:'A',name:'Form + status',render:()=>`${title}<div class="grid"><section class="box"><h2>Connection settings</h2>${fields}${action}</section><aside><div class="box"><h2>Connection status</h2>${results}</div>${note}</aside></div>`},
{key:'B',name:'Guided sections',render:()=>`${title}<div class="wide"><div class="steps"><div class="current">1 &nbsp; Repository</div><div>2 &nbsp; Check access</div><div>3 &nbsp; Save</div></div><section class="box"><h2>1. Repository details</h2>${fields}</section><section class="box"><h2>2. Connection checks</h2>${results}<div class="bottom"><button type="button" data-action="validate">Validate connection</button></div></section><section class="box"><h2>3. Save configuration</h2>${note}<button type="button" data-action="save">Save</button> <button style="margin-left:24px" type="button" class="primary" data-action="apply">Apply</button><span class="status" data-save-feedback></span></section></div>`},
{key:'C',name:'Settings + summary',render:()=>`${title}<div class="split"><div class="side-list"><div class="current">Connection</div><div>Access &amp; permissions</div><div>Apply changes</div></div><div><section class="box compact"><h2>Connection</h2>${fields}</section><section class="box"><h2>Access &amp; permissions</h2>${results}<div class="bottom"><button type="button" data-action="validate">Validate connection</button></div></section><section class="box"><h2>Apply changes</h2>${note}<button type="button" data-action="save">Save</button> <button style="margin-left:24px" type="button" class="primary" data-action="apply">Apply</button><span class="status" data-save-feedback></span></section></div></div>`}
];
let index = Math.max(0, layouts.findIndex(x => x.key === new URLSearchParams(location.search).get('variant')));
function render(){const layout=layouts[index];document.getElementById('app').innerHTML=layout.render()+`<p id="feedback" class="status" aria-live="polite">Prototype: example values and statuses; no settings are saved.</p>`;document.getElementById('variant-label').textContent=layout.key+' · '+layout.name;const url=new URL(location);url.searchParams.set('variant',layout.key);history.replaceState(null,'',url);document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{b.dataset.action==='save'?(document.querySelector('[data-save-feedback]').textContent=' Example: draft saved.'):(b.dataset.action==='apply'?(document.querySelector('[data-save-feedback]').textContent=' Example: ready to apply; no changes made.'):(document.getElementById('feedback').textContent=b.dataset.action==='polling'?'Prototype only — polling was not restarted.':'Prototype only — example validation results are shown in connection status.'))}))}
function cycle(n){index=(index+n+layouts.length)%layouts.length;render()}document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.matches('input, textarea, [contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>
